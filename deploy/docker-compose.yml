services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: floral_bliss
    volumes:
      - mysql_data:/var/lib/mysql
      - ../floral_bliss.sql:/tmp/floral_bliss.sql:ro
      - ./mysql/zz-import.sh:/docker-entrypoint-initdb.d/zz-import.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: floral_bliss
      PORT: "5000"
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mysql_data:
